<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Petting</title>

    <!-- Fuente Poppins desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reset básico y centrado perfecto */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
            max-width: 580px;
            width: 100%;
        }

        .logo-container {
            margin-bottom: 28px;
        }

        .logo-container img {
            width: 100%;
            max-width: 240px;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .description {
            color: #333333;
            /* Escala de texto fluida entre móvil y desktop */
            font-size: clamp(0.875rem, 2.5vw, 1.1rem);
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            text-wrap: balance; /* Equilibra las líneas automáticamente en móviles */
        }

        .coming-soon {
            color: #555555;
            font-size: clamp(1.15rem, 3.5vw, 1.6rem);
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        /* Ajustes específicos para pantallas móviles ajustadas (< 480px) */
        @media (max-width: 480px) {
            .wrapper {
                padding: 16px;
            }

            .logo-container {
                margin-bottom: 20px;
            }

            .logo-container img {
                max-width: 160px;
            }

            .description {
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="logo-container">
        <!-- Reemplaza "logo.png" por el nombre/ruta de tu imagen -->
        <img src="logo.png" alt="Logo Petting">
    </div>

    <p class="description">
        En Petting creamos una propuesta de valor única, basada en la nutrición y el bienestar de los animales.
    </p>

    <h2 class="coming-soon">Nos vemos pronto!</h2>
</div>

</body>
</html>
